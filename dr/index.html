<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI Computer Doctor</title>

<style>
:root {
  --bg:#fff;
  --text:#111;
  --card:#f7f7f7;
  --border:#e5e5e5;
  --input:#f0f0f0;
  --primary:#4f7cff;
}

body.dark {
  --bg:#0f0f12;
  --text:#eaeaea;
  --card:#1a1a1f;
  --border:#2a2a2f;
  --input:#22222a;
}

body {
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}

h1{margin:0 0 10px;}

.chat-box{
  height:420px;
  overflow-y:auto;
  background:var(--input);
  border-radius:15px;
  padding:12px;
  margin-bottom:10px;
}

.msg{
  padding:10px;
  margin:8px 0;
  border-radius:12px;
  max-width:80%;
}

.user{
  background:var(--primary);
  color:white;
  margin-left:auto;
}

.ai{
  background:rgba(79,124,255,.12);
}

textarea{
  width:100%;
  height:80px;
  border-radius:10px;
  border:1px solid var(--border);
  padding:10px;
  font-size:16px;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:8px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:var(--primary);
  color:white;
}

input[type=file]{
  flex:1;
}

.theme-toggle{
  position:fixed;
  bottom:20px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  font-size:20px;
  border:none;
}
.step{
  margin-top:10px;
  padding:10px;
  border-left:4px solid var(--primary);
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>🩺 AI Computer Doctor</h1>

    <div id="chatBox" class="chat-box"></div>

    <textarea id="input" placeholder="Describe your issue..."></textarea>

    <div class="controls">
      <input type="file" id="file" accept="image/*"/>
      <button onclick="send()">Send</button>
    </div>

  </div>
</div>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<script>
let history=[];
let steps=[];
let stepIndex=0;

/* theme */
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark")?"dark":"light");
}
(function(){
  const t=localStorage.getItem("theme");
  if(t==="dark") document.body.classList.add("dark");
})();

/* chat */
function add(role,text){
  const div=document.createElement("div");
  div.className=`msg ${role}`;
  div.innerText=text;
  document.getElementById("chatBox").appendChild(div);
  document.getElementById("chatBox").scrollTop=999999;
}

async function toBase64(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.readAsDataURL(file);
  });
}

async function send(){
  const text=document.getElementById("input").value;
  const file=document.getElementById("file").files[0];
  if(!text && !file) return;

  add("user", text||"[image]");
  document.getElementById("input").value="";
  document.getElementById("file").value="";

  let image=null;
  if(file) image=await toBase64(file);

  const res=await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text,image,history})
  });

  const data=await res.json();

  add("ai",data.reply);

  history.push({role:"user",content:text});
  history.push({role:"assistant",content:data.reply});

  if(data.steps?.length){
    steps=data.steps;
    stepIndex=0;
    const box=document.createElement("div");
    box.className="msg ai";
    box.innerHTML=`
      <strong>Guided Steps</strong>
      <div id="stepText" class="step">${steps[0]}</div>
      <button onclick="nextStep()">Next Step</button>
    `;
    document.getElementById("chatBox").appendChild(box);
  }
}

function nextStep(){
  stepIndex++;
  const el=document.getElementById("stepText");

  if(stepIndex>=steps.length){
    el.innerText="✅ Done. If still broken, contact support.";
    return;
  }

  el.innerText=steps[stepIndex];
}
</script>

</body>
</html>
