<!doctype html>
<meta charset="utf-8">
<style>
  :root { --aqua:#70F2FF; --peri:#6999F5; --bg:#0C0F18; --surface:#141828; --text:#E8EDF8; --muted:#8B95A8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; position:relative; }
  .glow { position:absolute; inset:0;
    background: radial-gradient(900px 520px at 12% -8%, rgba(105,153,245,.30), transparent 70%),
                radial-gradient(800px 480px at 96% 108%, rgba(112,242,255,.16), transparent 70%); }
  .grid { position:absolute; inset:0; opacity:.05;
    background-image: linear-gradient(var(--peri) 1px, transparent 1px), linear-gradient(90deg, var(--peri) 1px, transparent 1px);
    background-size: 80px 80px; }
  #stage { position:absolute; inset:0; padding:84px 120px 120px; }
  .kicker { font-family:'DejaVu Sans Mono',monospace; font-size:24px; letter-spacing:.22em; color:var(--aqua); text-transform:uppercase; }
  h1 { font-family:'Inter Display','Inter',sans-serif; font-weight:700; font-size:84px; letter-spacing:-.025em; line-height:1.08; margin-top:18px; }
  .rule { width:120px; height:6px; border-radius:3px; margin-top:28px; background:linear-gradient(90deg,var(--aqua),var(--peri)); }
  ul { list-style:none; margin-top:44px; display:flex; flex-direction:column; gap:var(--gap,20px); }
  li { display:flex; align-items:center; gap:30px; padding:var(--pad,18px) 32px; border-radius:18px;
    background:rgba(20,24,40,.72); border:1.5px solid rgba(112,242,255,.10); position:relative; }
  li .num { flex:none; width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
    font-family:'DejaVu Sans Mono',monospace; font-size:24px; color:var(--muted); border:2px solid rgba(139,149,168,.4); }
  li .main { font-size:var(--main,40px); font-weight:600; letter-spacing:-.012em; line-height:1.15; }
  li .sub { font-size:var(--subsz,27px); color:var(--muted); margin-top:6px; line-height:1.2; }
  li.past .main { color:#B9C2D6; }
  li.now { border-color:rgba(112,242,255,.55); background:rgba(28,36,60,.92); box-shadow:0 0 60px rgba(112,242,255,.10); }
  li.now .num { color:#0C0F18; background:var(--aqua); border-color:var(--aqua); font-weight:700; }
  li.now .sub { color:#C4EEF4; }
  .footer { position:absolute; left:120px; right:120px; bottom:44px; display:flex; justify-content:space-between; align-items:center;
    font-size:22px; color:var(--muted); letter-spacing:.04em; }
  .footer b { color:var(--text); font-weight:600; }
  .bar { position:absolute; left:0; bottom:0; height:8px; background:linear-gradient(90deg,var(--peri),var(--aqua)); }
  .center { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding-bottom:40px; }
  .center h1 { font-size:122px; }
  .center .subtitle { font-size:44px; color:#B9C2D6; margin-top:36px; max-width:1300px; line-height:1.3; }
  .shield { position:absolute; right:130px; top:50%; transform:translateY(-54%); width:370px; opacity:.95; }
  .take { margin-top:50px; }
  .take li { padding:22px 32px; }
</style>
<div class="glow"></div><div class="grid"></div>
<div id="stage"></div>
<div class="footer"><span><b>Linear Tech</b> &nbsp;·&nbsp; Security Awareness Training</span><span id="where"></span></div>
<div class="bar" id="bar"></div>
<script>
const SHIELD = `<svg class="shield" viewBox="0 0 200 230" fill="none">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70F2FF"/><stop offset="1" stop-color="#6999F5"/></linearGradient></defs>
  <path d="M100 8 L186 40 V108 C186 164 150 204 100 222 C50 204 14 164 14 108 V40 Z" stroke="url(#g)" stroke-width="7" fill="rgba(105,153,245,.10)" stroke-linejoin="round"/>
  <path d="M62 114 L90 142 L140 86" stroke="url(#g)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let C;
function init(content){ C = content; }
// scene: 0 intro, 1..N sections, N+1 outro. n: bullets revealed. p: 0..1 entrance progress. frac: video progress.
function draw(scene, n, p, frac){
  const st = document.getElementById('stage'), N = C.sections.length;
  const anim = `opacity:${p};transform:translateY(${(1-p)*36}px)`;
  let h = '';
  if (scene === 0) {
    h = `<div class="center" style="${anim}"><div class="kicker">Security Awareness Training</div><h1>${esc(C.intro.title)}</h1><div class="rule"></div><div class="subtitle">${esc(C.intro.subtitle)}</div></div>${SHIELD.replace('class="shield"', `class="shield" style="opacity:${p}"`)}`;
  } else if (scene === N + 1) {
    h = `<div style="${anim}"><div class="kicker">Key takeaways</div><h1>${esc(C.outro.title)}</h1><div class="rule"></div><ul class="take">` +
      C.outro.items.map((t,i)=>`<li class="now"><span class="num">✓</span><div class="main">${esc(t)}</div></li>`).join('') + `</ul></div>`;
  } else {
    const s = C.sections[scene-1], k = s.items.length;
    const v = k >= 7 ? '--gap:9px;--pad:7px;--main:34px;--subsz:23px;margin-top:28px' : k === 5 ? '--gap:16px;--pad:16px' : '--gap:22px;--pad:24px;--main:42px;--subsz:28px';
    h = `<div style="${n===0?anim:''}"><div class="kicker">Section ${String(scene).padStart(2,'0')} / ${N}</div><h1 style="${k>=7?'font-size:68px':''}">${esc(s.title)}</h1><div class="rule"></div></div><ul style="${v}">` +
      s.items.map((it,i)=>{ const j=i+1; if (j>n) return `<li style="visibility:hidden"><span class="num">${j}</span><div><div class="main">${esc(it[0])}</div><div class="sub">${esc(it[1])}</div></div></li>`;
        return `<li class="${j===n?'now':'past'}" style="${j===n?`opacity:${p};transform:translateX(${(1-p)*-40}px)`:''}"><span class="num">${j}</span><div><div class="main">${esc(it[0])}</div><div class="sub">${esc(it[1])}</div></div></li>`; }).join('') + `</ul>`;
  }
  st.innerHTML = h;
  document.getElementById('where').textContent = scene>=1 && scene<=N ? `${scene} of ${N}` : '';
  document.getElementById('bar').style.width = (frac*100) + '%';
}
</script>
