<!doctype html>
<meta charset="utf-8">
<style>
  :root { --aqua:#70F2FF; --peri:#6999F5; --bg:#0C0F18; --text:#E8EDF8; --muted:#8B95A8; --red:#FF5C7A; --green:#4ADE80; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; position:relative; }
  .glow { position:absolute; inset:0;
    background: radial-gradient(900px 520px at 12% -8%, rgba(105,153,245,.30), transparent 70%),
                radial-gradient(800px 480px at 96% 108%, rgba(112,242,255,.16), transparent 70%); }
  .grid { position:absolute; inset:0; opacity:.05;
    background-image: linear-gradient(var(--peri) 1px, transparent 1px), linear-gradient(90deg, var(--peri) 1px, transparent 1px);
    background-size: 80px 80px; }
  #stage { position:absolute; inset:0; padding:84px 120px 120px; }
  .kicker { font-family:'DejaVu Sans Mono',monospace; font-size:24px; letter-spacing:.22em; color:var(--aqua); text-transform:uppercase; }
  h1 { font-family:'Inter Display','Inter',sans-serif; font-weight:700; font-size:84px; letter-spacing:-.025em; line-height:1.08; margin-top:18px; }
  .rule { width:120px; height:6px; border-radius:3px; margin-top:28px; background:linear-gradient(90deg,var(--aqua),var(--peri)); }
  ul { list-style:none; margin-top:44px; display:flex; flex-direction:column; gap:var(--gap,20px); }
  li { display:flex; align-items:center; gap:30px; padding:var(--pad,18px) 32px; border-radius:18px;
    background:rgba(20,24,40,.72); border:1.5px solid rgba(112,242,255,.10); }
  li .num { flex:none; width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
    font-family:'DejaVu Sans Mono',monospace; font-size:24px; color:var(--muted); border:2px solid rgba(139,149,168,.4); }
  li .main { font-size:var(--main,40px); font-weight:600; letter-spacing:-.012em; line-height:1.15; }
  li .sub { font-size:var(--subsz,27px); color:var(--muted); margin-top:6px; line-height:1.2; }
  li.past .main { color:#B9C2D6; }
  li.now { border-color:rgba(112,242,255,.55); background:rgba(28,36,60,.92); box-shadow:0 0 60px rgba(112,242,255,.10); }
  li.now .num { color:#0C0F18; background:var(--aqua); border-color:var(--aqua); font-weight:700; }
  li.now .sub { color:#C4EEF4; }
  .footer { position:absolute; left:120px; right:120px; bottom:44px; display:flex; justify-content:space-between; align-items:center;
    font-size:22px; color:var(--muted); letter-spacing:.04em; }
  .brand { display:flex; align-items:center; gap:22px; }
  .brand img { height:46px; display:block; }
  .brand i { width:1.5px; height:30px; background:rgba(139,149,168,.45); }
  .hero { position:absolute; right:150px; top:50%; transform:translateY(-54%); width:400px; height:400px; border-radius:92px; display:grid; place-items:center;
    background: radial-gradient(260px 240px at 18% 30%, rgba(112,242,255,.85), transparent 70%), radial-gradient(280px 260px at 82% 72%, rgba(105,153,245,.85), transparent 70%), #05060A;
    box-shadow:0 30px 120px rgba(105,153,245,.25); }
  .hero img { width:250px; }
  .endlogo { position:absolute; right:120px; top:92px; height:92px; }
  .bar { position:absolute; left:0; bottom:0; height:8px; background:linear-gradient(90deg,var(--peri),var(--aqua)); }
  .center { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding-bottom:40px; }
  .center h1 { font-size:112px; max-width:1100px; }
  .center .subtitle { font-size:44px; color:#B9C2D6; margin-top:36px; }

  /* phishing email example */
  .small h1 { font-size:64px; margin-top:12px; }
  .split { display:flex; gap:48px; margin-top:34px; align-items:flex-start; }
  .mail { flex:none; width:1010px; background:#F4F7FB; color:#1F2937; border-radius:20px; overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,.5); font-size:27px; }
  .mail .top { background:#E3E9F3; padding:12px 26px; font-size:20px; color:#6B7280; display:flex; gap:10px; align-items:center; }
  .mail .top s { width:14px; height:14px; border-radius:50%; background:#C3CBD9; }
  .mail .in { padding:22px 30px 26px; }
  .mail .subj { font-size:30px; font-weight:700; line-height:1.2; }
  .mail .from { margin-top:30px; display:flex; align-items:center; gap:16px; }
  .mail .av { width:52px; height:52px; border-radius:50%; background:#4D7FE8; color:#fff; display:grid; place-items:center; font-weight:700; }
  .mail .addr { color:#6B7280; font-size:22px; }
  .mail hr { border:0; border-top:1.5px solid #DDE3EE; margin:18px 0; }
  .mail p { line-height:1.45; margin-top:12px; }
  .mail .btn { display:inline-block; background:#2563EB; color:#fff; font-weight:600; padding:13px 28px; border-radius:8px; }
  .mail .url { font-family:'DejaVu Sans Mono',monospace; font-size:19px; color:#374151; background:#fff; border:1px solid #CBD3E1; padding:6px 12px; border-radius:6px; margin-left:16px; }
  .mail .att { display:inline-flex; align-items:center; gap:12px; border:1.5px solid #CBD3E1; background:#fff; border-radius:10px; padding:10px 18px; font-size:22px; }
  .hit { position:relative; display:inline-block; border-radius:10px; padding:4px 10px; margin:-4px -10px; }
  .hit.on { outline:4px solid var(--red); background:rgba(255,92,122,.13); }
  .hit.on.dim { outline-color:rgba(255,92,122,.45); background:transparent; }
  .hit b.tag { position:absolute; right:-18px; top:-18px; width:38px; height:38px; border-radius:50%; background:var(--red); color:#fff; font-size:20px; display:grid; place-items:center; font-family:'DejaVu Sans Mono',monospace; }
  .flags { flex:1; margin-top:0; --gap:13px; }
  .flags li { padding:15px 22px; gap:20px; }
  .flags li .num { width:44px; height:44px; font-size:20px; }
  .flags li .main { font-size:30px; }
  .flags li.now { border-color:rgba(255,92,122,.7); box-shadow:0 0 50px rgba(255,92,122,.12); }
  .flags li.now .num, .flags li.past .num { background:var(--red); border-color:var(--red); color:#fff; }
  .flags li.past .num { opacity:.6; }

  /* quiz */
  .q { margin-top:34px; font-size:46px; line-height:1.28; font-weight:500; letter-spacing:-.01em; padding:6px 0 6px 34px; border-left:6px solid var(--peri); max-width:1560px; }
  .opts { margin-top:38px; --gap:18px; }
  .opts li { padding:20px 30px; }
  .opts li .num { font-size:26px; font-weight:700; color:var(--text); }
  .opts li .main { font-size:38px; }
  .opts li.right { border-color:var(--green); background:rgba(34,80,56,.55); box-shadow:0 0 60px rgba(74,222,128,.14); }
  .opts li.right .num { background:var(--green); border-color:var(--green); color:#0C0F18; }
  .why { margin-top:30px; font-size:32px; color:#C9F5D8; display:flex; gap:16px; align-items:center; }
  .why b { color:var(--green); font-family:'DejaVu Sans Mono',monospace; letter-spacing:.14em; font-size:24px; }
  .think { margin-top:30px; font-size:30px; color:var(--muted); }

  /* closing: four words */
  .words { display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:50px; }
  .word { padding:34px 40px; border-radius:22px; background:rgba(20,24,40,.72); border:1.5px solid rgba(112,242,255,.12); }
  .word.now { border-color:rgba(112,242,255,.6); background:rgba(28,36,60,.92); box-shadow:0 0 60px rgba(112,242,255,.12); }
  .word .w { font-family:'Inter Display','Inter',sans-serif; font-size:76px; font-weight:700; letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--aqua),var(--peri)); -webkit-background-clip:text; color:transparent; display:inline-block; }
  .word .d { font-size:31px; color:#B9C2D6; margin-top:8px; }
</style>
<div class="glow"></div><div class="grid"></div>
<div id="stage"></div>
<div class="footer"><span class="brand"><img src="../../zurech3/assets/logo-white.svg" alt="linear"><i></i><span id="label"></span></span><span id="where"></span></div>
<div class="bar" id="bar"></div>
<script>
const A = '../../zurech3/assets/';
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let S;
function init(content){ S = content.scenes; document.getElementById('label').textContent = content.footer || 'Security Awareness Training'; }
// si: scene index. n: step within the scene. p: 0..1 entrance progress. frac: overall video progress.
function draw(si, n, p, frac){
  const s = S[si], st = document.getElementById('stage');
  const up = `opacity:${p};transform:translateY(${(1-p)*36}px)`, side = `opacity:${p};transform:translateX(${(1-p)*-40}px)`;
  const first = n === 0 ? up : '';
  const head = (cls='') => `<div class="${cls}" style="${first}"><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div></div>`;
  let h = '';
  if (s.type === 'intro') {
    h = `<div class="center" style="${up}"><div class="kicker">${esc(s.kicker || 'Employee Training')}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="subtitle">${esc(s.subtitle)}</div></div><div class="hero" style="opacity:${p}"><img src="${A}icon-white.svg"></div>`;
  } else if (s.type === 'bullets') {
    const k = s.items.length, v = k >= 5 ? '--gap:16px;--pad:16px' : '--gap:22px;--pad:24px;--main:42px;--subsz:28px';
    h = head() + `<ul style="${v}">` + s.items.map((it,i)=>{ const j=i+1;
      return `<li class="${j===n?'now':'past'}" style="${j>n?'visibility:hidden':j===n?side:''}"><span class="num">${j}</span><div><div class="main">${esc(it[0])}</div><div class="sub">${esc(it[1])}</div></div></li>`; }).join('') + `</ul>`;
  } else if (s.type === 'email') {
    const e = s.email, idx = {}; s.flags.forEach((f,i)=>{ if (f[0]) idx[f[0]] = i+1; });
    const hit = (key, inner) => { const j = idx[key], on = j <= n;
      return `<span class="hit ${on?'on':''} ${on&&j<n?'dim':''}">${inner}${on?`<b class="tag" style="${j===n?`opacity:${p}`:''}">${j}</b>`:''}</span>`; };
    h = head('small') + `<div class="split" style="${first}"><div class="mail"><div class="top"><s></s><s></s><s></s>&nbsp; Inbox</div><div class="in">
      <div class="subj">${hit('subject', esc(e.subject))}</div>
      <div class="from"><span class="av">M</span><div>${hit('from', `<b>${esc(e.name)}</b> <span class="addr">&lt;${esc(e.addr)}&gt;</span>`)}<div class="addr" style="margin-top:4px">To: you</div></div></div><hr>
      <p>${hit('greeting', esc(e.greeting))}</p><p>${esc(e.body)}</p>
      <p style="margin-top:22px">${hit('link', `<span class="btn">${esc(e.button)}</span><span class="url">${esc(e.link)}</span>`)}</p><hr>
      ${hit('attach', `<span class="att">📎 ${esc(e.attach)}</span>`)}</div></div>
      <ul class="flags">` + s.flags.map((f,i)=>{ const j=i+1;
        return `<li class="${j===n?'now':'past'}" style="${j>n?'visibility:hidden':j===n?side:''}"><span class="num">${f[0]?j:'!'}</span><div class="main">${esc(f[1])}</div></li>`; }).join('') + `</ul></div>`;
  } else if (s.type === 'quiz') {
    h = head('small') + `<div style="${first}"><div class="q">${esc(s.question)}</div><ul class="opts">` + s.options.map((o,i)=>{
        const right = n===1 && i===s.answer, wrong = n===1 && i!==s.answer;
        return `<li class="${right?'right':''}" style="${wrong?`opacity:${1-.62*p}`:''}"><span class="num">${right?'✓':'ABC'[i]}</span><div class="main">${esc(o)}</div></li>`; }).join('') + `</ul>` +
      (n===1 ? `<div class="why" style="${up}"><b>WHY</b>${esc(s.explain)}</div>` : `<div class="think">Take a moment to decide…</div>`) + `</div>`;
  } else if (s.type === 'outro') {
    h = `<img class="endlogo" style="${n===0?`opacity:${p}`:''}" src="${A}logo-white.svg">` + head() + `<div class="words">` + s.items.map((it,i)=>{ const j=i+1;
      return `<div class="word ${j===n?'now':''}" style="${j>n?'visibility:hidden':j===n?up:''}"><div class="w">${esc(it[0])}.</div><div class="d">${esc(it[1])}</div></div>`; }).join('') + `</div>`;
  }
  st.innerHTML = h;
  document.getElementById('where').textContent = s.type==='quiz' ? s.kicker : '';
  document.getElementById('bar').style.width = (frac*100) + '%';
}
</script>
