<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Linear Sign — e-signatures</title>
<meta name="description" content="Upload a PDF, drop signature fields, send for signature, and track status. By Linear IT." />
<link rel="icon" href="/sign/assets/icon.png" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* ---- Linear IT brand palette (matches vault + time) ---- */
  :root,[data-theme="dark"]{
    --bg:#0f1117; --bg2:#1a1d27; --panel:#181c2a; --panel2:#1e2235; --bg3:#222536;
    --line:#2a2f45; --line2:#353b56;
    --text:#eef0f6; --muted:#7c85a2; --faint:#4e5571;
    --brand:#00b0ec; --brand-h:#009bd2; --brand2:#4fc3f0; --brandink:#fff;
    --accent-bg:rgba(0,176,236,.16);
    --green:#4ade80; --green-bg:rgba(74,222,128,.12);
    --amber:#fbbf24; --red:#f87171; --red-bg:rgba(248,113,113,.12); --sky:#00b0ec;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.45); --patop:.35;
  }
  [data-theme="light"]{
    --bg:#f4f6fb; --bg2:#ffffff; --panel:#ffffff; --panel2:#f8f9fd; --bg3:#eef0f8;
    --line:#dde1ee; --line2:#c8cee0;
    --text:#1a1d2e; --muted:#5a6080; --faint:#9aa0bc;
    --brand:#0091c9; --brand-h:#007cae; --brand2:#33a8d6; --brandink:#fff;
    --accent-bg:rgba(0,145,201,.12);
    --green:#16a34a; --green-bg:rgba(22,163,74,.08);
    --amber:#d97706; --red:#dc2626; --red-bg:rgba(220,38,38,.08); --sky:#0091c9;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.10); --patop:.5;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:center/cover no-repeat url("/sign/assets/pattern.png");opacity:var(--patop)}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit}
  .hidden{display:none!important}

  /* ---- Brand logo ---- */
  .logo{display:flex;align-items:center;gap:11px}
  .brandlogo{display:block;height:26px;width:89px;flex:none;
    background:center/contain no-repeat url("/sign/assets/logo-white.png")}
  [data-theme="light"] .brandlogo{background-image:url("/sign/assets/logo-dark.png")}
  .brandtag{font-size:15px;font-weight:700;color:var(--muted);padding-left:11px;margin-left:1px;border-left:1px solid var(--line2)}
  .logo.big .brandlogo{height:40px;width:137px}
  .logo.big .brandtag{font-size:19px}

  /* ---- Top bar ---- */
  header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:10px}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
    border-radius:9px;color:var(--muted);border:1px solid transparent;background:transparent;cursor:pointer;font-size:16px}
  .iconbtn:hover{background:var(--bg3);color:var(--text)}

  /* ---- Buttons ---- */
  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);
    padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .btn:hover{border-color:var(--brand);background:var(--bg3)}
  .btn.primary{background:var(--brand);border-color:transparent;color:#fff}
  .btn.primary:hover{background:var(--brand-h)}
  .btn.ghost{background:transparent}
  .btn.danger{border-color:var(--red);color:var(--red)}
  .btn.danger:hover{background:var(--red-bg)}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 80px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  h2{font-size:18px;margin:0 0 12px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}

  input[type=text],input[type=email],input[type=number],textarea,select{
    width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);
    padding:11px 13px;border-radius:10px;font-size:14px;outline:none;font-family:inherit}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-bg)}
  label.fld{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;gap:12px}
  .row>*{flex:1}
  .note{color:var(--faint);font-size:12.5px;margin-top:8px}
  .err{background:var(--red-bg);border:1px solid var(--red);color:var(--red);padding:10px 13px;border-radius:10px;font-size:13.5px;margin:12px 0}
  .ok{background:var(--green-bg);border:1px solid var(--green);color:var(--green);padding:10px 13px;border-radius:10px;font-size:13.5px;margin:12px 0}

  /* ---- Login ---- */
  .center-screen{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:24px}
  .login-card{width:100%;max-width:410px}
  .login-card .logo{justify-content:center;margin-bottom:18px}
  .code-input{letter-spacing:10px;text-align:center;font-size:24px;font-weight:700}

  /* ---- Dashboard ---- */
  .dash-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
  .tab{padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:transparent}
  .tab.active{background:var(--bg3);color:var(--text)}
  .doclist{display:flex;flex-direction:column;gap:10px}
  .docrow{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:15px 18px;cursor:pointer;transition:.15s}
  .docrow:hover{border-color:var(--brand);transform:translateY(-1px)}
  .docrow .ico{width:40px;height:48px;border-radius:6px;background:var(--bg3);border:1px solid var(--line2);
    display:grid;place-items:center;color:var(--brand);font-size:20px;flex:none}
  .docrow .meta{flex:1;min-width:0}
  .docrow .ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .docrow .dsub{color:var(--faint);font-size:12.5px;margin-top:3px}
  .pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:capitalize;white-space:nowrap}
  .pill.draft{background:var(--bg3);color:var(--muted)}
  .pill.sent{background:var(--accent-bg);color:var(--brand)}
  .pill.completed{background:var(--green-bg);color:var(--green)}
  .pill.voided,.pill.declined{background:var(--red-bg);color:var(--red)}
  .prog{font-size:12px;color:var(--muted);white-space:nowrap}
  .empty{text-align:center;color:var(--faint);padding:70px 20px}
  .empty .big{font-size:44px;margin-bottom:10px}

  /* ---- Modal ---- */
  .backdrop{position:fixed;inset:0;background:rgba(4,6,14,.7);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:90vh;overflow:auto}
  .modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mbody{padding:20px 22px}
  .modal .mfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;background:none;border:none}

  /* ---- Editor ---- */
  .editor{display:flex;flex-direction:column;height:calc(100vh - 58px)}
  .etoolbar{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
  .etoolbar .etitle{font-weight:700;font-size:15px;border:1px solid transparent;background:transparent;color:var(--text);border-radius:8px;padding:6px 8px;min-width:160px}
  .etoolbar .etitle:hover,.etoolbar .etitle:focus{border-color:var(--line2);background:var(--bg)}
  .estage{flex:1;display:flex;min-height:0;position:relative}
  .epages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--bg)}
  .zoombar{display:flex;align-items:center;gap:1px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
  .zoombar button{border:none;background:transparent;color:var(--text);cursor:pointer;padding:5px 9px;border-radius:7px;font-size:13px;font-weight:600;line-height:1}
  .zoombar button:hover{background:var(--bg3)}
  .zoombar .zpct{min-width:42px;text-align:center;color:var(--muted);font-size:12.5px}
  .pagenav{position:absolute;bottom:16px;left:calc(50% - 150px);transform:translateX(-50%);display:none;align-items:center;gap:4px;
    background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow);z-index:15}
  @media(max-width:820px){.pagenav{left:50%}}
  .pagenav button{border:none;background:transparent;color:var(--text);cursor:pointer;font-size:18px;width:30px;height:30px;border-radius:50%;line-height:1}
  .pagenav button:hover{background:var(--bg3)}
  .pagenav .pind{font-size:12.5px;color:var(--muted);min-width:56px;text-align:center}
  .eside{width:300px;flex:none;border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:18px}
  @media(max-width:820px){.eside{display:none}}
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 18px}
  .ptool{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line2);border-radius:10px;
    background:var(--panel);cursor:grab;font-size:13px;font-weight:600;user-select:none}
  .ptool:hover{border-color:var(--brand)}
  .ptool.active{border-color:var(--brand);background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent-bg)}
  .ptool .pi{font-size:15px}

  /* Height is intentionally NOT set: the canvas's own aspect ratio drives it, so
     the box can never clip the page (any size, rotation, or mixed-size PDF). */
  .page{position:relative;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5);border-radius:2px;flex:none;height:auto}
  .page canvas{display:block;width:100%;height:auto}
  .flayer{position:absolute;inset:0}
  .fld{position:absolute;border:1.5px dashed;border-radius:4px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;cursor:move;overflow:hidden;background:rgba(0,176,236,.12);color:#1f2430;box-sizing:border-box}
  .fld .flabel{pointer-events:none;padding:0 4px;text-align:center;line-height:1.05;text-shadow:0 1px 2px rgba(255,255,255,.6)}
  .fld .fdel{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--red);
    color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;display:none;place-items:center}
  .fld:hover .fdel{display:grid}
  .fld .fres{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;cursor:nwse-resize;
    background:currentColor;border-radius:3px 0 3px 0;opacity:.85}
  .recip-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
  .recip-item .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .recip-item .rmeta{flex:1;min-width:0}
  .recip-item .rmeta b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recip-item .rmeta span{font-size:11.5px;color:var(--faint)}
  .recip-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line2);font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--panel);color:var(--text)}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.active{background:var(--bg3)}
  .sect-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}

  /* ---- Signer ---- */
  .sign-top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:30}
  .sbanner{background:var(--brand);color:#fff;padding:12px 20px;font-size:14px;display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
  .sfld{position:absolute;border:1.5px solid var(--brand);border-radius:5px;background:rgba(0,176,236,.14);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0a3d54;font-weight:700;font-size:12px;box-sizing:border-box;transition:.12s}
  .sfld:hover{background:rgba(0,176,236,.26)}
  .sfld.done{border-style:solid;border-color:var(--green);background:rgba(74,222,128,.12)}
  .sfld.req::after{content:"*";color:var(--red);position:absolute;top:1px;right:3px;font-size:13px}
  .sfld img{max-width:100%;max-height:100%;object-fit:contain}
  .sfld input{border:none;background:transparent;text-align:center;width:100%;height:100%;color:#111;font-weight:600;padding:0 3px}
  .sigpad{border:1px dashed var(--line2);border-radius:12px;background:#fff;touch-action:none;width:100%;display:block}
  .sig-tabs{display:flex;gap:6px;margin-bottom:12px}
  .tinput{font-family:'Brush Script MT','Segoe Script',cursive;font-size:30px;text-align:center;color:#111;background:#fff;height:90px}
  .stat-done{text-align:center;padding:60px 20px}
  .stat-done .big{font-size:60px;margin-bottom:14px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line2);
    color:var(--text);padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:200;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.err{border-color:var(--red);color:var(--red)}
  .spin{width:18px;height:18px;border:2.5px solid var(--accent-bg);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{display:grid;place-items:center;padding:80px;color:var(--muted);gap:14px}
</style>
</head>
<body>
  <div id="app"><div class="loading"><span class="spin"></span>Loading…</div></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>
  <!-- Absolute path so it resolves the same whether the page is served from
       www.linearit.co/sign/ or reverse-proxied at sign.linearit.co/ -->
  <script src="/sign/app.js"></script>
</body>
</html>
