<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Linear Meet</title>
<meta name="description" content="Video and voice meetings you join with a link. No signup, no app — open the link, pick a name, and you're in."/>
<link rel="icon" href="/meet/assets/icon.png"/>
<link rel="apple-touch-icon" href="/meet/assets/icon.png"/>
<meta name="theme-color" content="#0f1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Linear Meet"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://meet.linearit.co wss://meet.linearit.co;"/>
<meta name="referrer" content="no-referrer"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#222536;
  --text:#eef0f6;--muted:#8a93b0;--faint:#4e5571;
  --accent:#00b0ec;--accent-h:#009bd2;--accent-bg:rgba(0,176,236,.16);
  --border:#2a2f45;--card:#181c2a;--tile:#10131c;
  --danger:#ef4444;--danger-h:#dc2626;--success:#4ade80;--warn:#fbbf24;
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --logo:url("/meet/assets/logo-white.png");
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f4f6fb;--bg2:#ffffff;--bg3:#eef0f8;
    --text:#1a1d2e;--muted:#5a6080;--faint:#9aa0bc;
    --accent:#0091c9;--accent-h:#007cae;--accent-bg:rgba(0,145,201,.10);
    --border:#dde1ee;--card:#ffffff;--tile:#1a1d27;
    --shadow:0 10px 30px rgba(0,0,0,.12);
    --logo:url("/meet/assets/logo-dark.png");
  }
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;background:var(--bg3);border:1px solid var(--border)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn:disabled{opacity:.5;cursor:default}
.logo{width:132px;height:30px;background:var(--logo) left center/contain no-repeat}

/* ---------- lobby ---------- */
#lobby{height:100%;overflow:auto;padding:20px 16px 40px}
.lobby-top{max-width:1040px;margin:0 auto 26px;display:flex;align-items:center;justify-content:space-between}
.lobby-wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:center}
@media (max-width:820px){.lobby-wrap{grid-template-columns:1fr;gap:20px}}
.preview{position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--tile);box-shadow:var(--shadow)}
.preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.preview .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfd4e6;font-size:15px}
.preview .pbar{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:12px}
.meter{position:absolute;left:14px;top:14px;display:flex;gap:3px;align-items:flex-end;height:18px}
.meter i{width:4px;background:var(--success);border-radius:2px;height:3px;transition:height .08s}
.join h1{font-size:28px;line-height:1.2;margin-bottom:8px}
.join p.sub{color:var(--muted);margin-bottom:20px}
.join label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.join .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.banner{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35)}
.banner.err{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)}
.inside{font-size:13px;color:var(--muted);margin-top:12px}
.or{display:flex;gap:10px;margin-top:18px}
.or input{flex:1}

/* ---------- meeting ---------- */
#meeting{height:100%;display:flex;flex-direction:column;background:#0b0d13;color:#eef0f6}
.stage-wrap{flex:1;display:flex;min-height:0}
#stage{flex:1;min-width:0;padding:12px;display:flex;gap:12px;min-height:0}
#grid{flex:1;display:grid;gap:10px;align-content:center;justify-content:center;min-height:0}
#stage.presenting{flex-direction:row}
#stage.presenting #screenArea{flex:1;min-width:0;display:flex}
#stage.presenting #grid{flex:0 0 220px;grid-template-columns:1fr!important;align-content:start;overflow:auto}
@media (max-width:760px){
  #stage.presenting{flex-direction:column}
  #stage.presenting #grid{flex:0 0 120px;grid-auto-flow:column;grid-template-columns:none!important;grid-auto-columns:160px;overflow-x:auto}
}
#screenArea{display:none}
.tile{position:relative;background:#161a26;border-radius:14px;overflow:hidden;aspect-ratio:16/9;min-width:0;border:2px solid transparent;transition:border-color .15s}
.tile.speaking{border-color:var(--accent)}
.tile video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.tile.self video{transform:scaleX(-1)}
.tile.screen{aspect-ratio:auto;flex:1}
.tile.screen video{object-fit:contain}
.tile .av{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#161a26}
.tile .av b{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff}
.tile .nm{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);font-size:13px;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.tile .badge span{background:rgba(0,0,0,.6);border-radius:7px;padding:2px 7px;font-size:13px}
.tile .react{position:absolute;left:50%;top:40%;font-size:54px;transform:translate(-50%,-50%);animation:pop 2.2s ease forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0f1219;border-top:1px solid #1f2433}
.bar .mid{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.bar .side{display:flex;gap:8px;align-items:center;min-width:0}
.bar .room{font-size:13px;color:#8a93b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{position:relative;width:48px;height:48px;border-radius:50%;background:#262b3b;display:flex;align-items:center;justify-content:center;transition:background .12s}
.cb:hover{background:#323851}
.cb.off{background:var(--danger)}
.cb.off:hover{background:var(--danger-h)}
.cb.on{background:var(--accent)}
.cb.leave{width:64px;border-radius:24px;background:var(--danger)}
.cb.leave:hover{background:var(--danger-h)}
.cb svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb .dot{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media (max-width:640px){
  .bar .side{display:none}
  .bar{justify-content:center}
  .cb{width:44px;height:44px}
  .hide-sm{display:none!important}
}
.pop-menu{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);background:#1b1f2c;border:1px solid #2a2f45;border-radius:14px;padding:6px;display:flex;gap:2px;box-shadow:var(--shadow);z-index:5}
.pop-menu button{font-size:26px;padding:6px 8px;border-radius:10px}
.pop-menu button:hover{background:#2a3044}

#panel{width:340px;max-width:100%;background:#121520;border-left:1px solid #1f2433;display:flex;flex-direction:column;min-height:0}
@media (max-width:760px){#panel{position:fixed;inset:0;width:auto;z-index:20}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #1f2433}
.tabs{display:flex;gap:6px}
.tabs button{padding:7px 12px;border-radius:9px;font-weight:600;color:#8a93b0}
.tabs button.act{background:#232839;color:#fff}
.pbody{flex:1;overflow:auto;padding:12px 14px}
#msgs .m{margin-bottom:12px}
#msgs .m .who{font-size:12px;color:#8a93b0;margin-bottom:2px}
#msgs .m .tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
#msgs .m.me .who{color:var(--accent)}
#msgs .sys{font-size:12px;color:#6b7390;margin-bottom:10px;text-align:center}
.compose{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1f2433}
.compose input{background:#1b1f2c;border-color:#2a2f45;color:#eef0f6}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1c2030}
.person .pa{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.person .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .pn small{color:#8a93b0}
.person .ic{font-size:14px;opacity:.9}
.person .pm{padding:4px 8px;border-radius:7px;background:#232839;font-size:12px}
.hostbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hostbar .btn{padding:7px 12px;font-size:13px;background:#232839;border-color:#2a2f45;color:#eef0f6}

#toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none;align-items:center}
#toasts div{background:rgba(20,23,33,.94);color:#eef0f6;border:1px solid #2a2f45;padding:8px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .box{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h2{font-size:20px;margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:16px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#ended{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
#ended h1{font-size:26px;margin-bottom:8px}
#ended p{color:var(--muted);margin-bottom:20px}
</style>
</head>
<body>

<!-- ============ Lobby ============ -->
<section id="lobby">
  <div class="lobby-top"><a href="https://www.linearit.co/" class="logo" aria-label="Linear IT"></a></div>
  <div class="lobby-wrap">
    <div>
      <div class="preview">
        <video id="pv" autoplay playsinline muted></video>
        <div class="off hidden" id="pvOff">Camera is off</div>
        <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="pbar">
          <button class="cb" id="lMic" title="Microphone"></button>
          <button class="cb" id="lCam" title="Camera"></button>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <select id="selMic" aria-label="Microphone"></select>
        <select id="selCam" aria-label="Camera"></select>
      </div>
    </div>
    <div class="join">
      <h1 id="jTitle">Linear Meet</h1>
      <p class="sub" id="jSub">Video and voice meetings you join with a link. No signup, no app.</p>
      <label for="name">Your name</label>
      <input id="name" maxlength="40" autocomplete="name" placeholder="e.g. Sam from Linear IT"/>
      <div class="actions">
        <button class="btn primary" id="joinBtn">Join now</button>
        <button class="btn primary" id="newBtn">Start a new meeting</button>
      </div>
      <div class="or" id="codeRow">
        <input id="code" placeholder="Have a code or link? Paste it here" aria-label="Meeting code or link"/>
        <button class="btn" id="codeBtn">Go</button>
      </div>
      <div class="inside" id="inside"></div>
      <div class="banner hidden" id="lobbyMsg"></div>
    </div>
  </div>
</section>

<!-- ============ Meeting ============ -->
<section id="meeting" class="hidden">
  <div class="stage-wrap">
    <div id="stage">
      <div id="screenArea"></div>
      <div id="grid"></div>
    </div>
    <aside id="panel" class="hidden">
      <div class="ph">
        <div class="tabs"><button id="tabChat" class="act">Chat</button><button id="tabPeople">People</button></div>
        <button class="cb" id="closePanel" title="Close" style="width:36px;height:36px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="pbody" id="chatBody"><div id="msgs"></div></div>
      <div class="compose" id="compose"><input id="chatIn" maxlength="1000" placeholder="Send a message to everyone"/><button class="btn primary" id="chatSend">Send</button></div>
      <div class="pbody hidden" id="peopleBody">
        <div class="hostbar hidden" id="hostbar">
          <button class="btn" id="muteAll">Mute everyone</button>
          <button class="btn" id="lockBtn">Lock meeting</button>
        </div>
        <div id="people"></div>
      </div>
    </aside>
  </div>
  <div class="bar">
    <div class="side"><span class="room" id="roomLabel"></span></div>
    <div class="mid">
      <button class="cb" id="bMic" title="Mute (M)"></button>
      <button class="cb" id="bCam" title="Camera (V)"></button>
      <button class="cb hide-sm" id="bShare" title="Share screen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M12 13V8M9.5 10.5L12 8l2.5 2.5"/></svg></button>
      <button class="cb" id="bHand" title="Raise hand"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 8 8h1a7 7 0 0 0 7-7v-3a2 2 0 0 0-4 0"/></svg></button>
      <span style="position:relative"><button class="cb" id="bReact" title="Send a reaction"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button><div class="pop-menu hidden" id="reactMenu"></div></span>
      <button class="cb" id="bChat" title="Chat"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="dot hidden" id="unread"></span></button>
      <button class="cb" id="bPeople" title="People"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span class="dot" id="count">1</span></button>
      <button class="cb" id="bLink" title="Copy invite link"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
      <button class="cb leave" id="bLeave" title="Leave"><svg viewBox="0 0 24 24"><path d="M3 15.5c5-5 13-5 18 0l-2.5 2.5-3-1.5v-3a11 11 0 0 0-7 0v3l-3 1.5z" fill="#fff" stroke="none"/></svg></button>
    </div>
    <div class="side"></div>
  </div>
</section>

<!-- ============ Ended ============ -->
<section id="ended" class="hidden">
  <div>
    <div class="logo" style="margin:0 auto 22px"></div>
    <h1 id="endTitle">You left the meeting</h1>
    <p id="endSub">Thanks for joining.</p>
    <div class="actions" style="display:flex;gap:10px;justify-content:center">
      <button class="btn primary" id="rejoin">Rejoin</button>
      <button class="btn" id="home">New meeting</button>
    </div>
  </div>
</section>

<div id="toasts"></div>
<script src="/meet/app.js"></script>
</body>
</html>
