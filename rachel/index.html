<!DOCTYPE html>
<html lang="en">
<head>

<title>Linear — Email Signature</title>

          <td width="215" valign="middle" style="padding-right:20px;">

          <td valign="middle"
              style="font-family:'Space Mono','Roboto Mono','Courier New',monospace;line-height:1.8;white-space:nowrap;">
            <div style="color:#8BB8F3;font-size:15px;font-weight:700;letter-spacing:1.5px;">RACHEL, BILLING MANAGER</div>
            <div style="font-size:14.5px;letter-spacing:1.2px;">
              <a href="tel:+18456041462" style="color:#111111;text-decoration:none;">845-604-1462</a>
            </div>
            <div style="font-size:14.5px;letter-spacing:1.2px;">
              <a href="mailto:billing@linearit.co" style="color:#111111;text-decoration:none;">BILLING@LINEARIT.CO</a>
            </div>
            <div style="font-size:14.5px;letter-spacing:1.2px;">
              <a href="https://linearit.co" style="color:#111111;text-decoration:none;">LINEARIT.CO</a>
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</div>
