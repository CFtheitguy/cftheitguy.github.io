<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--acc:#5b8cff;--acc2:#ff5b8c;--txt:#e8ebf7;--mut:#8a91b4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid #2a3155}
header h1{margin:0;font-size:22px;cursor:pointer}header h1 span{color:var(--acc)}
#score{margin-left:auto;color:var(--mut);font-size:14px}
main{max-width:1000px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{background:var(--card);border-radius:14px;padding:22px;cursor:pointer;border:1px solid #2a3155;transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:var(--acc)}.tile .ic{font-size:44px}.tile h3{margin:10px 0 4px}.tile p{margin:0;color:var(--mut);font-size:14px}
.tile small{display:block;margin-top:8px;color:var(--acc)}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer}button.sec{background:#2a3155}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.bar .info{color:var(--mut)}
canvas{background:#0a0d18;border-radius:10px;display:block;max-width:100%;border:1px solid #2a3155}
.ttt{display:grid;grid-template-columns:repeat(3,100px);gap:6px}.ttt div{height:100px;background:var(--card);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;cursor:pointer}
.mem{display:grid;grid-template-columns:repeat(4,80px);gap:8px}.mem div{height:80px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;user-select:none}
.mem div.up,.mem div.ok{background:var(--card)}.mem div.ok{opacity:.5}
.g2048{display:grid;grid-template-columns:repeat(4,80px);gap:8px;background:#2a3155;padding:8px;border-radius:10px;width:max-content}
.g2048 div{height:80px;border-radius:8px;background:#1a1f36;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
#cur{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #ffd23f;pointer-events:none;z-index:99;display:none;transition:background .1s}
#cur.pinch{background:#ffd23f}
#cam{position:fixed;right:12px;bottom:12px;width:200px;display:none;z-index:98;background:#000;border-radius:10px;overflow:hidden;border:2px solid var(--acc)}
#cam video{width:100%;display:block;transform:scaleX(-1)}#camtxt{font-size:12px;padding:4px 8px;color:var(--mut)}
.msg{margin-top:12px;font-size:18px;min-height:24px}
</style></head><body>
<header><h1 onclick="home()">🎮 Game<span>Hub</span></h1><div id="score"></div><button id="handBtn">✋ Hand control: OFF</button></header>
<div id="cur"></div><div id="cam"><video id="vid" autoplay playsinline muted></video><div id="camtxt">Loading…</div></div>
<main id="app"></main>
<script>
const app=document.getElementById('app');let stop=()=>{};
const best=(k,v)=>{let b=+(localStorage.getItem('gh_'+k)||0);if(v!=null&&v>b){localStorage.setItem('gh_'+k,v);b=v}return b};
const games={
 snake:{ic:'🐍',name:'Snake',d:'Eat, grow, don\'t crash. Arrow keys / WASD.',run:snake},
 breakout:{ic:'🧱',name:'Breakout',d:'Smash the bricks. Mouse or arrows.',run:breakout},
 g2048:{ic:'🔢',name:'2048',d:'Merge tiles to reach 2048. Arrow keys.',run:g2048},
 ttt:{ic:'❌',name:'Tic-Tac-Toe',d:'Beat the unbeatable computer.',run:ttt},
 memory:{ic:'🃏',name:'Memory',d:'Match all the pairs, fewest moves.',run:memory},
 plane:{ic:'✈️',name:'Sky Pilot',d:'Fly a jet and blast enemies. Steer with one hand, or hold an imaginary wheel with two hands.',run:plane},
 flappy:{ic:'🐤',name:'Flappy',d:'Fly through the pipes. Space / click.',run:flappy},
};
function home(){stop();stop=()=>{};document.getElementById('score').textContent='';
 app.innerHTML='<div class="grid">'+Object.entries(games).map(([k,g])=>`<div class="tile" onclick="play('${k}')"><div class="ic">${g.ic}</div><h3>${g.name}</h3><p>${g.d}</p><small>Best: ${best(k)}</small></div>`).join('')+'</div>'}
function play(k){stop();app.innerHTML=`<div class="bar"><button class="sec" onclick="home()">← Back</button><button onclick="play('${k}')">Restart</button><span class="info" id="info"></span></div><div id="g"></div><div class="msg" id="msg"></div>`;
 document.getElementById('score').textContent=games[k].name+' · Best: '+best(k);games[k].run(document.getElementById('g'),k)}
const info=t=>document.getElementById('info').textContent=t,msg=t=>document.getElementById('msg').textContent=t;
function keys(fn){const h=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();fn(e)};addEventListener('keydown',h);return()=>removeEventListener('keydown',h)}

function snake(el,k){el.innerHTML='<canvas width=400 height=400></canvas>';const c=el.firstChild.getContext('2d'),N=20,S=20;
 let s=[{x:10,y:10}],d={x:1,y:0},nd=d,f=food(),sc=0,dead=false;function food(){let p;do p={x:Math.random()*N|0,y:Math.random()*N|0};while(s&&s.some(q=>q.x==p.x&&q.y==p.y));return p}
 const un=keys(e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&(m[0]!=-d.x||m[1]!=-d.y))nd={x:m[0],y:m[1]}});
 const t=setInterval(()=>{if(dead)return;d=nd;const h={x:s[0].x+d.x,y:s[0].y+d.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||s.some(q=>q.x==h.x&&q.y==h.y)){dead=true;best(k,sc);msg('💀 Game over! Score '+sc);return}
  s.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;f=food()}else s.pop();info('Score: '+sc);
  c.fillStyle='#0a0d18';c.fillRect(0,0,400,400);c.fillStyle='#ff5b8c';c.fillRect(f.x*S+2,f.y*S+2,S-4,S-4);
  s.forEach((q,i)=>{c.fillStyle=i?'#4cd97b':'#9dffb9';c.fillRect(q.x*S+1,q.y*S+1,S-2,S-2)})},110);
 stop=()=>{clearInterval(t);un()}}

function breakout(el,k){el.innerHTML='<canvas width=480 height=400></canvas>';const cv=el.firstChild,c=cv.getContext('2d');
 let px=200,bx=240,by=300,vx=3,vy=-3,sc=0,lives=3,L=false,R=false,run=true,br=[];
 for(let r=0;r<5;r++)for(let i=0;i<8;i++)br.push({x:i*58+12,y:r*22+40,a:1,col:`hsl(${r*50},80%,60%)`});
 const un=keys(e=>{if(e.key=='ArrowLeft')L=true;if(e.key=='ArrowRight')R=true});const ku=e=>{if(e.key=='ArrowLeft')L=false;if(e.key=='ArrowRight')R=false};addEventListener('keyup',ku);
 cv.onmousemove=e=>{const r=cv.getBoundingClientRect();px=(e.clientX-r.left)*480/r.width-40};
 let raf;(function loop(){if(!run)return;if(L)px-=6;if(R)px+=6;px=Math.max(0,Math.min(400,px));bx+=vx;by+=vy;
  if(bx<6||bx>474)vx=-vx;if(by<6)vy=-vy;if(by>372&&by<382&&bx>px&&bx<px+80){vy=-Math.abs(vy);vx=(bx-px-40)/8}
  if(by>400){lives--;if(!lives){run=false;best(k,sc);msg('💀 Game over! Score '+sc)}bx=240;by=300;vy=-3;vx=3}
  br.forEach(b=>{if(b.a&&bx>b.x&&bx<b.x+54&&by>b.y&&by<b.y+18){b.a=0;vy=-vy;sc+=10}});
  if(br.every(b=>!b.a)){run=false;best(k,sc);msg('🏆 You win! Score '+sc)}
  c.fillStyle='#0a0d18';c.fillRect(0,0,480,400);br.forEach(b=>{if(b.a){c.fillStyle=b.col;c.fillRect(b.x,b.y,54,18)}});
  c.fillStyle='#5b8cff';c.fillRect(px,380,80,10);c.fillStyle='#fff';c.beginPath();c.arc(bx,by,6,0,7);c.fill();info(`Score: ${sc}  Lives: ${lives}`);raf=requestAnimationFrame(loop)})();
 stop=()=>{run=false;cancelAnimationFrame(raf);un();removeEventListener('keyup',ku)}}

function g2048(el,k){let b=Array(16).fill(0),sc=0;const add=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4};add();add();
 const col=v=>v?`hsl(${40-Math.log2(v)*8},${60+Math.log2(v)*3}%,${70-Math.log2(v)*3}%)`:'#1a1f36';
 const draw=()=>{el.innerHTML='<div class="g2048">'+b.map(v=>`<div style="background:${col(v)};color:${v>4?'#fff':'#333'}">${v||''}</div>`).join('')+'</div>';info('Score: '+sc)};
 const slide=row=>{let r=row.filter(v=>v);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;sc+=r[i];if(r[i]==2048)msg('🏆 2048! Keep going!');r.splice(i+1,1)}while(r.length<4)r.push(0);return r};
 const move=dir=>{const old=b.join();for(let i=0;i<4;i++){let idx=[0,1,2,3].map(j=>dir=='L'?i*4+j:dir=='R'?i*4+3-j:dir=='U'?j*4+i:(3-j)*4+i);const r=slide(idx.map(x=>b[x]));idx.forEach((x,j)=>b[x]=r[j])}
  if(b.join()!=old){add();best(k,sc);draw();const can=b.some((v,i)=>!v||(i%4<3&&v==b[i+1])||(i<12&&v==b[i+4]));if(!can)msg('💀 No moves left! Score '+sc)}};
 stop=keys(e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];if(m)move(m)});draw()}

function ttt(el,k){let b=Array(9).fill(''),over=false,wins=+best(k);const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 const win=x=>{for(const[a,c,d]of L)if(x[a]&&x[a]==x[c]&&x[a]==x[d])return x[a];return x.every(v=>v)?'T':null};
 const mm=(x,p)=>{const w=win(x);if(w)return w=='O'?10:w=='X'?-10:0;let bs=p=='O'?-99:99;x.forEach((v,i)=>{if(!v){x[i]=p;const s=mm(x,p=='O'?'X':'O');x[i]='';bs=p=='O'?Math.max(bs,s):Math.min(bs,s)}});return bs};
 const draw=()=>{el.innerHTML='<div class="ttt">'+b.map((v,i)=>`<div data-i=${i} style="color:${v=='X'?'#5b8cff':'#ff5b8c'}">${v}</div>`).join('')+'</div>';
  el.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>clk(+d.dataset.i))};
 const end=w=>{over=true;msg(w=='X'?'🏆 You win!':w=='O'?'🤖 Computer wins!':'🤝 Draw!');if(w!='O')best(k,++wins)};
 const clk=i=>{if(over||b[i])return;b[i]='X';let w=win(b);if(!w){let bi=-1,bs=-99;b.forEach((v,j)=>{if(!v){b[j]='O';const s=mm(b,'X');b[j]='';if(s>bs){bs=s;bi=j}}});b[bi]='O';w=win(b)}draw();if(w)end(w)};
 info('You are X. Best = games not lost.');draw()}

function memory(el,k){const e=['🍎','🚀','🐶','⚽','🎸','🌈','🍕','👑'];let cs=[...e,...e].sort(()=>Math.random()-.5).map(v=>({v,s:0})),open=[],mv=0,lock=false;
 const draw=()=>{el.innerHTML='<div class="mem">'+cs.map((c,i)=>`<div data-i=${i} class="${c.s==2?'ok':c.s?'up':''}">${c.s?c.v:'?'}</div>`).join('')+'</div>';info('Moves: '+mv);
  el.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>clk(+d.dataset.i))};
 const clk=i=>{if(lock||cs[i].s)return;cs[i].s=1;open.push(i);if(open.length==2){mv++;const[a,b]=open;open=[];
  if(cs[a].v==cs[b].v){cs[a].s=cs[b].s=2;if(cs.every(c=>c.s==2)){const p=Math.max(0,100-mv);best(k,p);msg(`🏆 Done in ${mv} moves! Points: ${p}`)}}
  else{lock=true;setTimeout(()=>{cs[a].s=cs[b].s=0;lock=false;draw()},700)}}draw()};draw()}

function flappy(el,k){el.innerHTML='<canvas width=400 height=500></canvas>';const cv=el.firstChild,c=cv.getContext('2d');
 let y=250,v=0,p=[],t=0,sc=0,dead=false,started=false,raf;const flap=()=>{if(dead)return;started=true;v=-6.5};
 const un=keys(e=>{if(e.key==' '||e.key=='ArrowUp')flap()});cv.onmousedown=flap;msg('Press Space or click to start');
 (function loop(){if(started&&!dead){v+=.35;y+=v;if(t++%90==0)p.push({x:400,g:80+Math.random()*260});p.forEach(q=>q.x-=2.5);
   if(p[0]&&p[0].x<-60){p.shift();sc++;info('Score: '+sc)}
   if(y>490||y<0||p.some(q=>q.x<100&&q.x+60>70&&(y-12<q.g||y+12>q.g+140))){dead=true;best(k,sc);msg('💀 Game over! Score '+sc)}else msg('')}
  c.fillStyle='#0a0d18';c.fillRect(0,0,400,500);c.fillStyle='#4cd97b';p.forEach(q=>{c.fillRect(q.x,0,60,q.g);c.fillRect(q.x,q.g+140,60,500)});
  c.fillStyle='#ffd23f';c.beginPath();c.arc(85,y,12,0,7);c.fill();raf=requestAnimationFrame(loop)})();
 stop=()=>{cancelAnimationFrame(raf);un()}}
function plane(el,k){el.innerHTML='<canvas width=600 height=500></canvas>';const cv=el.firstChild,c=cv.getContext('2d'),W=600,H=500;
 let px=300,py=420,tx=300,ty=420,b=[],en=[],cl=[],st=[],sc=0,lives=3,t=0,inv=0,run=true,raf,K={};
 for(let i=0;i<6;i++)cl.push({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()});
 cv.onmousemove=e=>{if(window.handState&&handState.hands.length)return;const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)*W/r.width;ty=(e.clientY-r.top)*H/r.height};
 const kd=e=>{K[e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault()},ku=e=>K[e.key]=0;addEventListener('keydown',kd);addEventListener('keyup',ku);
 info('Steer: 1 hand = plane follows it · 2 hands = steering wheel (tilt to turn, raise/lower to climb) · or mouse/arrows');
 (function loop(){if(!run)return;raf=requestAnimationFrame(loop);t++;
  const hs=window.handState?handState.hands:[];let mode='mouse';
  if(hs.length>=2){mode='wheel';const[a,b2]=hs[0].x<hs[1].x?[hs[0],hs[1]]:[hs[1],hs[0]];const tilt=b2.y-a.y;tx=px+tilt*60;ty=((a.y+b2.y)/2-.15)/.7*H}
  else if(hs.length==1){mode='hand';tx=(hs[0].x-.1)/.8*W;ty=(hs[0].y-.1)/.8*H}
  if(K.ArrowLeft)tx=px-8;if(K.ArrowRight)tx=px+8;if(K.ArrowUp)ty=py-8;if(K.ArrowDown)ty=py+8;
  tx=Math.max(25,Math.min(W-25,tx));ty=Math.max(40,Math.min(H-30,ty));const vx=(tx-px)*.15;px+=vx;py+=(ty-py)*.15;
  if(t%8==0)b.push({x:px-12,y:py-20},{x:px+12,y:py-20});
  if(t%Math.max(18,50-(sc/100|0))==0)en.push({x:30+Math.random()*(W-60),y:-30,v:1.5+Math.random()*2+sc/1500,hp:2});
  if(t%300==0)st.push({x:30+Math.random()*(W-60),y:-20});
  c.fillStyle='#4a90d9';c.fillRect(0,0,W,H);
  cl.forEach(q=>{q.y+=q.s*2;if(q.y>H+40){q.y=-40;q.x=Math.random()*W}c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(q.x,q.y,30*q.s,0,7);c.arc(q.x+25*q.s,q.y+5,22*q.s,0,7);c.arc(q.x-25*q.s,q.y+5,22*q.s,0,7);c.fill()});
  c.fillStyle='#ffd23f';b=b.filter(q=>(q.y-=10)>-10);b.forEach(q=>c.fillRect(q.x-2,q.y,4,12));
  st=st.filter(q=>{q.y+=2;c.font='26px serif';c.fillText('⭐',q.x-13,q.y+9);if(Math.hypot(q.x-px,q.y-py)<30){sc+=100;lives=Math.min(5,lives+1);return false}return q.y<H+20});
  en=en.filter(e=>{e.y+=e.v;for(const q of b)if(!q.hit&&Math.abs(q.x-e.x)<20&&Math.abs(q.y-e.y)<18){q.hit=1;e.hp--}
   if(e.hp<=0){sc+=25;return false}
   if(!inv&&Math.hypot(e.x-px,e.y-py)<32){lives--;inv=90;if(lives<=0){run=false;best(k,sc);msg('💥 Crashed! Score '+sc)}return false}
   c.save();c.translate(e.x,e.y);c.fillStyle='#c0392b';c.beginPath();c.moveTo(0,22);c.lineTo(-20,-12);c.lineTo(0,-4);c.lineTo(20,-12);c.closePath();c.fill();c.restore();return e.y<H+30});
  b=b.filter(q=>!q.hit);if(inv)inv--;
  if(!(inv%10>5)){c.save();c.translate(px,py);c.rotate(Math.max(-.5,Math.min(.5,vx*.05)));c.fillStyle='#eef';
   c.beginPath();c.moveTo(0,-28);c.lineTo(6,-8);c.lineTo(30,6);c.lineTo(30,12);c.lineTo(6,6);c.lineTo(4,20);c.lineTo(12,26);c.lineTo(-12,26);c.lineTo(-4,20);c.lineTo(-6,6);c.lineTo(-30,12);c.lineTo(-30,6);c.lineTo(-6,-8);c.closePath();c.fill();
   c.fillStyle='#5b8cff';c.fillRect(-3,-18,6,10);c.fillStyle='#ff9f1c';c.fillRect(-3,26,6,4+Math.random()*8);c.restore()}
  c.fillStyle='#fff';c.font='bold 18px system-ui';c.fillText(`Score ${sc}   ${'❤️'.repeat(Math.max(0,lives))}`,12,26);
  c.font='13px system-ui';c.fillText({wheel:'🎮 Two-hand wheel',hand:'✋ One-hand steering',mouse:'🖱 Mouse / arrows'}[mode],12,H-12)})();
 stop=()=>{run=false;cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku)}}
home();
</script>
<script type="module">
// Hand control: index fingertip = cursor, pinch (thumb+index) = click,
// move hand to the edge of the camera view = arrow key (Snake, 2048, Breakout)
const V='0.10.14',btn=document.getElementById('handBtn'),cur=document.getElementById('cur'),cam=document.getElementById('cam'),vid=document.getElementById('vid'),txt=document.getElementById('camtxt');
let on=false,lm=null,stream=null,sx=innerWidth/2,sy=innerHeight/2,pinched=false,dir=null;
const key=(t,k)=>dispatchEvent(new KeyboardEvent(t,{key:k}));
btn.onclick=async()=>{on=!on;btn.textContent='✋ Hand control: '+(on?'ON':'OFF');cam.style.display=cur.style.display=on?'block':'none';
 if(!on){window.handState=null;stream&&stream.getTracks().forEach(t=>t.stop());stream=null;if(dir)key('keyup',dir);dir=null;return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});vid.srcObject=stream;
  if(!lm){txt.textContent='Loading hand model…';const {FilesetResolver,HandLandmarker}=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/vision_bundle.mjs`);
   const fs=await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/wasm`);
   lm=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2})}
  txt.textContent='Show your hand';loop()}catch(e){txt.textContent='Error: '+e.message;console.error(e)}};
function loop(){if(!on)return;requestAnimationFrame(loop);if(vid.readyState<2)return;
 const r=lm.detectForVideo(vid,performance.now()),h=r.landmarks&&r.landmarks[0];
 window.handState={hands:(r.landmarks||[]).map(q=>({x:1-q[9].x,y:q[9].y,pinch:Math.hypot(q[8].x-q[4].x,q[8].y-q[4].y)<.06}))};
 if(!h){txt.textContent='No hand seen';if(dir){key('keyup',dir);dir=null}return}
 const tip=h[8],th=h[4],nx=1-tip.x,ny=tip.y;
 // map central 80% of camera to full screen, smoothed
 const tx=Math.min(1,Math.max(0,(nx-.1)/.8))*innerWidth,ty=Math.min(1,Math.max(0,(ny-.1)/.8))*innerHeight;
 sx+=(tx-sx)*.4;sy+=(ty-sy)*.4;cur.style.left=sx+'px';cur.style.top=sy+'px';
 const el=document.elementFromPoint(sx,sy);if(el)el.dispatchEvent(new MouseEvent('mousemove',{clientX:sx,clientY:sy,bubbles:true}));
 const p=Math.hypot(tip.x-th.x,tip.y-th.y)<.06;cur.classList.toggle('pinch',p);
 if(p&&!pinched&&el){el.dispatchEvent(new MouseEvent('mousedown',{clientX:sx,clientY:sy,bubbles:true}));el.click();key('keydown',' ')}
 pinched=p;
 const dx=nx-.5,dy=ny-.5;let d=null;if(Math.max(Math.abs(dx),Math.abs(dy))>.18)d=Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp');
 if(d!==dir){if(dir)key('keyup',dir);if(d)key('keydown',d);dir=d}
