<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<title>Money – Simple Budget</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e7ef;--accent:#2f6fed;--in:#1a9b5b;--out:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#11151c;--card:#1a202b;--ink:#e8ecf3;--muted:#9aa3b5;--line:#2a3240;--accent:#5b8ff9;--in:#3cc47f;--out:#f06b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px;font-size:1.8rem}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat .lbl{color:var(--muted);font-size:.85rem}
.stat .val{font-size:1.4rem;font-weight:700}
.in{color:var(--in)}.out{color:var(--out)}
form{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:8px}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;background:var(--line);color:var(--ink)}
.seg button.on[data-t=out]{background:var(--out);color:#fff}.seg button.on[data-t=in]{background:var(--in);color:#fff}
input,select,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
button{background:var(--accent);color:#fff;border:0;cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:.85rem}
td.amt{text-align:right;font-variant-numeric:tabular-nums}
.del{background:none;color:var(--muted);padding:4px 8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--out)}
.cat{margin-bottom:10px}
.cat div:first-child{display:flex;justify-content:space-between}
.btnlike{background:var(--accent);color:#fff;padding:10px;border-radius:8px;font-weight:600;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:12px}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:600px){form{grid-template-columns:1fr 1fr}form input[name=desc]{grid-column:1/-1}form button{grid-column:1/-1}.stats .val{font-size:1.1rem}}
</style>
</head>
<body>
<main>
<h1>Money</h1>
<p class="sub">A simple budget tracker. Your data is saved on this device only.</p>
<div class="card tools">
  <button id="install" hidden>Install app</button>
  <button id="exp" type="button">Save backup file</button>
  <label class="btnlike">Load backup file<input type="file" id="imp" accept=".json,application/json" hidden></label>
</div>
<p class="sub" id="iosTip" hidden>On iPhone: tap Share, then "Add to Home Screen" to install.</p>

<div class="card tools">
  <label>Month <input type="month" id="month"></label>
  <label>Budget $ <input type="number" id="budget" min="0" step="1" style="width:120px"></label>
</div>

<div class="card stats">
  <div class="stat"><div class="lbl">Income</div><div class="val in" id="sIn">$0</div></div>
  <div class="stat"><div class="lbl">Spent</div><div class="val out" id="sOut">$0</div></div>
  <div class="stat"><div class="lbl">Left</div><div class="val" id="sLeft">$0</div></div>
</div>

<div class="card">
<div class="seg" id="seg"><button type="button" data-t="out" class="on">− Add Expense</button><button type="button" data-t="in">+ Add Income</button></div>
<form id="f">
  <input type="hidden" name="type" value="out">
  <input name="desc" placeholder="Description" required>
  <input name="date" type="date" required>
  <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
  <select name="cat">
    
  </select>
  <button>Add</button>
</form>
</div>

<div class="card"><h3 style="margin-top:0">Spending by category</h3><div id="cats"></div></div>

<div class="card">
<h3 style="margin-top:0">Transactions</h3>
<table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody id="list"></tbody></table>
</div>
</main>
<script>
const KEY='money-app-v1';
let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
data.tx=data.tx||[];data.budgets=data.budgets||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=new Date();$('month').value=now.toISOString().slice(0,7);
function render(){
  const m=$('month').value;
  const tx=data.tx.filter(t=>t.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
  const inc=tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const out=tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  const budget=data.budgets[m];
  $('budget').value=budget??'';
  $('sIn').textContent=fmt(inc);$('sOut').textContent=fmt(out);
  const left=(budget!=null&&budget!=='')?budget-out:inc-out;
  $('sLeft').textContent=fmt(left);$('sLeft').className='val '+(left<0?'out':'in');
  $('list').innerHTML=tx.length?tx.map(t=>`<tr><td>${t.date.slice(5)}</td><td>${esc(t.desc)}</td><td>${esc(t.cat)}</td><td class="amt ${t.type}">${t.type==='out'?'-':'+'}${fmt(t.amount)}</td><td><button class="del" data-id="${t.id}" title="Delete">✕</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No transactions this month.</td></tr>';
  const cats={};tx.filter(t=>t.type==='out').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amount);
  const max=Math.max(...Object.values(cats),1);
  $('cats').innerHTML=Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="cat"><div><span>${esc(c)}</span><span>${fmt(v)}</span></div><div class="bar"><span style="width:${v/max*100}%"></span></div></div>`).join(''):'<div class="empty">No expenses yet.</div>';
}
$('f').onsubmit=e=>{
  e.preventDefault();const f=e.target;const m=$('month').value;
  const date=f.date.value;
  data.tx.push({id:Date.now()+''+Math.random(),desc:f.desc.value.trim(),amount:parseFloat(f.amount.value),type:f.type.value,cat:f.cat.value,date});
  save();f.desc.value='';f.amount.value='';if(date.slice(0,7)!==m){$('month').value=date.slice(0,7);}f.desc.focus();render();
};
$('list').onclick=e=>{const id=e.target.dataset.id;if(id&&confirm('Delete this transaction?')){data.tx=data.tx.filter(t=>t.id!==id);save();render();}};
const CATS={out:['Food','Housing','Transport','Bills','Shopping','Health','Fun','Other'],in:['Salary','Business','Side job','Gift','Refund','Other income']};
function setType(t){const f=$('f');f.type.value=t;f.cat.innerHTML=CATS[t].map(c=>`<option>${c}</option>`).join('');f.desc.placeholder=t==='in'?'Income source (e.g. Paycheck)':'Description';f.querySelector('button').textContent=t==='in'?'Add income':'Add expense';f.querySelector('button').style.background=t==='in'?'var(--in)':'var(--out)';document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));}
$('seg').onclick=e=>{if(e.target.dataset.t)setType(e.target.dataset.t);};
setType('out');
function defDate(){const m=$('month').value,t=new Date().toISOString().slice(0,10);$('f').date.value=t.startsWith(m)?t:m+'-01';}
defDate();
$('month').onchange=()=>{defDate();render();};
$('budget').onchange=e=>{const v=e.target.value;if(v==='')delete data.budgets[$('month').value];else data.budgets[$('month').value]=parseFloat(v);save();render();};
render();
$('exp').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='money-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.tx))throw 0;if(!confirm('Replace current data with this backup?'))return;data={tx:d.tx,budgets:d.budgets||{}};save();render();}catch(_){alert('That file is not a valid Money backup.');}});e.target.value='';};
let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false;});
$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true;};
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)$('iosTip').hidden=false;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
