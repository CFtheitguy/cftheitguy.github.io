<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<title>Money – Simple Budget</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e7eb;--soft:#f1f5f9;--accent:#0f172a;--in:#059669;--out:#dc2626;--ring:rgba(15,23,42,.12);--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#121826;--ink:#e5e9f0;--muted:#8b95a7;--line:#222b3a;--soft:#1a2232;--accent:#e5e9f0;--in:#34d399;--out:#f87171;--ring:rgba(229,233,240,.15);--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:880px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:700}
.hact{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
.tip{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:.95rem;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.bar-top{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--muted);font-size:.78rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.stat .val{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.in{color:var(--in)}.out{color:var(--out)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form input[name=desc],form button{grid-column:1/-1}
.seg{display:flex;background:var(--soft);padding:4px;border-radius:10px;margin-bottom:14px}
.seg button{flex:1;background:transparent;color:var(--muted);border:0;padding:8px;box-shadow:none}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on[data-t=out]{color:var(--out)}.seg button.on[data-t=in]{color:var(--in)}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--muted);box-shadow:0 0 0 3px var(--ring)}
button,.btn{font:inherit;font-size:.88rem;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600;transition:opacity .15s,background .15s}
button:hover,.btn:hover{background:var(--soft)}
form button{background:var(--accent);color:var(--card);border:0;padding:11px}
form button:hover{opacity:.9;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:12px 6px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
td:first-child{color:var(--muted);white-space:nowrap}
td:nth-child(3){color:var(--muted)}
td.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);padding:4px 8px;opacity:.5}
.del:hover{opacity:1;color:var(--out);background:none}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--ink);border-radius:3px}
.cat{margin-bottom:14px;font-size:.9rem}
.cat div:first-child{display:flex;justify-content:space-between}
.cat div:first-child span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.sync{font-size:.8rem;color:var(--muted);align-self:center}
dialog{border:1px solid var(--line);border-radius:14px;padding:24px;background:var(--card);color:var(--ink);width:min(360px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog h2{font-size:1.1rem}dialog p{color:var(--muted);font-size:.88rem;margin:0 0 14px}
dialog form{grid-template-columns:1fr}.err{color:var(--out);font-size:.85rem;min-height:1.2em}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:500;padding:8px}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:.9rem}
.tablewrap{overflow-x:auto}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat .val{font-size:1.15rem}td:nth-child(3),th:nth-child(3){display:none}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><div class="logo">$</div>Money</div>
  <div class="hact">
    <button id="install" hidden>Install app</button>
    <span id="sync" class="sync"></span>
    <button id="acct" type="button">Sign in</button>
    <button id="exp" type="button">Export</button>
    <label class="btn">Import<input type="file" id="imp" accept=".json,application/json" hidden></label>
  </div>
</div></header>
<main>
<p class="tip" id="iosTip" hidden>To install on iPhone: tap Share, then “Add to Home Screen”.</p>

<div class="bar-top">
  <label class="field">Month<input type="month" id="month"></label>
  <label class="field">Monthly budget<input type="number" id="budget" min="0" step="1" placeholder="Optional" style="width:160px"></label>
</div>

<div class="stats">
  <div class="stat"><div class="lbl">Income</div><div class="val in" id="sIn">$0</div></div>
  <div class="stat"><div class="lbl">Spent</div><div class="val out" id="sOut">$0</div></div>
  <div class="stat"><div class="lbl">Remaining</div><div class="val" id="sLeft">$0</div></div>
</div>

<div class="grid2">
<div class="card" style="margin:0">
<h2>New entry</h2>
<div class="seg" id="seg"><button type="button" data-t="out" class="on">Expense</button><button type="button" data-t="in">Income</button></div>
<form id="f">
  <input type="hidden" name="type" value="out">
  <input name="desc" placeholder="Description" required>
  <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
  <input name="date" type="date" required>
  <select name="cat" style="grid-column:1/-1"></select>
  <button>Add</button>
</form>
</div>
<div class="card" style="margin:0"><h2>Spending by category</h2><div id="cats"></div></div>
</div>

<div class="card" style="margin-top:16px">
<h2>Transactions</h2>
<div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
</div>
</main>
<dialog id="dlg">
  <h2>Sign in</h2>
  <p>Sign in to sync your budget across all your devices.</p>
  <form id="lf" method="dialog">
    <input type="password" name="pw" placeholder="Password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button id="lbtn">Sign in</button>
    <button type="button" class="linkbtn" id="lcancel">Cancel</button>
  </form>
</dialog>
<script>
const API='https://money-api.linearit.co/api';
const LOCAL_KEY='money-app-v1',CLOUD_KEY='money-cloud-v1',TOKEN_KEY='money-token';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let token=ls.get(TOKEN_KEY);
const KEY=()=>token?CLOUD_KEY:LOCAL_KEY;
let data;
function load(){try{data=JSON.parse(ls.get(KEY()))||{}}catch(e){data={}}data.tx=data.tx||[];data.budgets=data.budgets||{};}
load();
const save=()=>ls.set(KEY(),JSON.stringify(data));
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});
  if(r.status===401&&token){signOut(true);throw new Error('Session expired, please sign in again.');}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t;}
// Push a change to the server when signed in; on failure re-pull so the screen matches the database.
function push(path,method,body){
  if(!token)return;
  setSync('Saving…');
  api(path,{method,body:body===undefined?undefined:JSON.stringify(body)}).then(()=>setSync('Synced')).catch(e=>{setSync('Not synced');alert('Could not save to your account: '+e.message);pull();});
}
async function pull(){
  if(!token)return;
  setSync('Syncing…');
  try{const d=await api('/data');data={tx:d.tx,budgets:d.budgets};save();render();setSync('Synced');}
  catch(e){setSync(navigator.onLine?'Not synced':'Offline');}
}
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=new Date();$('month').value=now.toISOString().slice(0,7);
function render(){
  const m=$('month').value;
  const tx=data.tx.filter(t=>t.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
  const inc=tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const out=tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  const budget=data.budgets[m];
  $('budget').value=budget??'';
  $('sIn').textContent=fmt(inc);$('sOut').textContent=fmt(out);
  const left=(budget!=null&&budget!=='')?budget-out:inc-out;
  $('sLeft').textContent=fmt(left);$('sLeft').className='val '+(left<0?'out':'in');
  $('list').innerHTML=tx.length?tx.map(t=>`<tr><td>${t.date.slice(5)}</td><td>${esc(t.desc)}</td><td>${esc(t.cat)}</td><td class="amt ${t.type}">${t.type==='out'?'-':'+'}${fmt(t.amount)}</td><td><button class="del" data-id="${t.id}" title="Delete" aria-label="Delete">✕</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No transactions this month.</td></tr>';
  const cats={};tx.filter(t=>t.type==='out').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amount);
  const max=Math.max(...Object.values(cats),1);
  $('cats').innerHTML=Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="cat"><div><span>${esc(c)}</span><span>${fmt(v)}</span></div><div class="bar"><span style="width:${v/max*100}%"></span></div></div>`).join(''):'<div class="empty">No expenses yet.</div>';
}
$('f').onsubmit=e=>{
  e.preventDefault();const f=e.target;const m=$('month').value;
  const date=f.date.value;
  const t={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),desc:f.desc.value.trim(),amount:parseFloat(f.amount.value),type:f.type.value,cat:f.cat.value,date};
  data.tx.push(t);save();push('/tx/'+t.id,'PUT',t);f.desc.value='';f.amount.value='';if(date.slice(0,7)!==m){$('month').value=date.slice(0,7);}f.desc.focus();render();
};
$('list').onclick=e=>{const id=e.target.dataset.id;if(id&&confirm('Delete this transaction?')){data.tx=data.tx.filter(t=>t.id!==id);save();push('/tx/'+encodeURIComponent(id),'DELETE');render();}};
const CATS={out:['Food','Housing','Transport','Bills','Shopping','Health','Fun','Other'],in:['Salary','Business','Side job','Gift','Refund','Other income']};
function setType(t){const f=$('f');f.type.value=t;f.cat.innerHTML=CATS[t].map(c=>`<option>${c}</option>`).join('');f.desc.placeholder=t==='in'?'Income source (e.g. Paycheck)':'Description';f.querySelector('button').textContent=t==='in'?'Add income':'Add expense';document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));}
$('seg').onclick=e=>{if(e.target.dataset.t)setType(e.target.dataset.t);};
setType('out');
function defDate(){const m=$('month').value,t=new Date().toISOString().slice(0,10);$('f').date.value=t.startsWith(m)?t:m+'-01';}
defDate();
$('month').onchange=()=>{defDate();render();};
$('budget').onchange=e=>{const v=e.target.value,m=$('month').value;if(v==='')delete data.budgets[m];else data.budgets[m]=parseFloat(v);save();push('/budget/'+m,'PUT',{amount:v===''?null:parseFloat(v)});render();};
render();
$('exp').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='money-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.tx))throw 0;if(!confirm('Replace current data with this backup?'))return;data={tx:d.tx,budgets:d.budgets||{}};save();push('/data','PUT',data);render();}catch(_){alert('That file is not a valid Money backup.');}});e.target.value='';};
let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false;});
$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true;};
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)$('iosTip').hidden=false;
function acctUI(){$('acct').textContent=token?'Sign out':'Sign in';if(!token)setSync('Local only');}
function signOut(expired){token=null;ls.del(TOKEN_KEY);ls.del(CLOUD_KEY);load();render();acctUI();if(expired)$('dlg').showModal();}
$('acct').onclick=()=>{if(token){if(confirm('Sign out on this device? Your data stays saved in your account.'))signOut();}else{$('lerr').textContent='';$('dlg').showModal();}};
$('lcancel').onclick=()=>$('dlg').close();
$('lf').onsubmit=async e=>{
  e.preventDefault();const pw=e.target.pw.value;$('lerr').textContent='';$('lbtn').disabled=true;
  try{
    const r=await api('/login',{method:'POST',body:JSON.stringify({password:pw})});
    token=r.token;ls.set(TOKEN_KEY,token);e.target.pw.value='';$('dlg').close();
    const server=await api('/data');
    let local;try{local=JSON.parse(ls.get(LOCAL_KEY))}catch(_){}
    if(local&&local.tx&&local.tx.length&&!server.tx.length&&confirm('Upload the '+local.tx.length+' entries saved on this device to your account?')){
      await api('/data',{method:'PUT',body:JSON.stringify(local)});
    }
    acctUI();await pull();
  }catch(err){
    $('lerr').textContent=err.message==='wrong_password'?'Wrong password.':err.message==='too_many_attempts'?'Too many attempts. Try again in 15 minutes.':'Could not sign in: '+err.message;
  }finally{$('lbtn').disabled=false;}
};
acctUI();load();render();pull();
addEventListener('focus',pull);addEventListener('online',pull);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
